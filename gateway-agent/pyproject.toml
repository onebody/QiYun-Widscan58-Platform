[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "widscan-gateway-agent"
version = "0.1.0"
description = "Multi-device Gateway Agent for WIDSCAN58 ESP32-C5 receivers (USB CDC + simulator)"
requires-python = ">=3.11"
license = {text = "GPL-3.0-or-later"}
dependencies = [
    "pyserial>=3.5",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
widscan-gateway = "widscan_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
