<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WIDSCAN58 Platform</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="pf-shell">
    <header class="pf-topbar">
      <div class="pf-brand">
        <span class="pf-brand__name">WIDSCAN58</span>
        <span class="pf-brand__sub">Platform</span>
      </div>
      <div class="pf-topbar__meta">
        <span class="pf-topbar__label">Site</span>
        <span id="pf-site-label" class="pf-topbar__value">—</span>
      </div>
      <div class="pf-topbar__meta">
        <span id="pf-server-badge" class="pf-badge pf-badge--disabled">状态未知</span>
      </div>
      <div class="pf-spacer"></div>
      <div class="pf-topbar__meta">
        <span class="pf-topbar__label">最近刷新</span>
        <span id="pf-last-refresh" class="pf-topbar__value pf-mono">—</span>
      </div>
      <a id="pf-console-link" class="pf-link" href="/app/" target="_blank" rel="noopener">RF Console ↗</a>
    </header>

    <nav class="pf-nav" aria-label="平台导航">
      <a class="pf-nav__item" data-route="overview" href="#/overview">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2" width="5" height="5"/><rect x="9" y="2" width="5" height="5"/><rect x="2" y="9" width="5" height="5"/><rect x="9" y="9" width="5" height="5"/></svg>
        <span>Overview</span>
      </a>
      <a class="pf-nav__item" data-route="sites" href="#/sites">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="10"/><path d="M5 6h2M9 6h2M5 9h2M9 9h2"/></svg>
        <span>Sites</span>
      </a>
      <a class="pf-nav__item" data-route="gateways" href="#/gateways">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="4"/><rect x="2" y="9" width="12" height="4"/><circle cx="5" cy="5" r="0.8"/><circle cx="5" cy="11" r="0.8"/></svg>
        <span>Gateways</span>
      </a>
      <a class="pf-nav__item" data-route="devices" href="#/devices">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="4" y="4" width="8" height="8"/><path d="M2 6h2M2 10h2M12 6h2M12 10h2M6 2v2M10 2v2M6 12v2M10 12v2"/></svg>
        <span>Devices</span>
      </a>
      <a class="pf-nav__item" data-route="measurements" href="#/measurements">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1 8h3l2-5 3 10 2-5h4"/></svg>
        <span>Measurements</span>
      </a>
      <a class="pf-nav__item pf-nav__item--external" data-route="console" href="#/console">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 8a6 6 0 0 1 12 0M4.5 8a3.5 3.5 0 0 1 7 0M7 8a1 1 0 0 1 2 0"/><circle cx="8" cy="11" r="1"/></svg>
        <span>RF Console</span>
      </a>
      <div class="pf-nav__gap"></div>
      <a class="pf-nav__item" data-route="system" href="#/system">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12"/><circle cx="5" cy="4" r="1.4"/><circle cx="11" cy="8" r="1.4"/><circle cx="7" cy="12" r="1.4"/></svg>
        <span>System</span>
      </a>
    </nav>

    <main class="pf-page" id="pf-page"></main>

    <footer class="pf-statusbar">
      <span>数据来源: <span id="pf-status-source">真实 API</span></span>
      <span class="pf-statusbar__sep">·</span>
      <span>刷新: <span id="pf-status-refresh" class="pf-mono">—</span></span>
      <span class="pf-statusbar__sep">·</span>
      <span>WebSocket: <span id="pf-status-ws">未实现（轮询）</span></span>
      <span class="pf-statusbar__sep">·</span>
      <span>版本: <span id="pf-status-version">未提供</span></span>
    </footer>
  </div>

  <noscript>该平台页面需要启用 JavaScript。</noscript>
  <script>
    /* 部署时可覆盖 Console 地址；留空则平台显示“未配置”。 */
    window.__PLATFORM_CONFIG__ = { consoleUrl: "/app/" };
  </script>
  <script src="app.js"></script>
</body>
</html>
